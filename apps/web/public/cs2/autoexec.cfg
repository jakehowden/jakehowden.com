// Jake's CS2 autoexec. Runs on launch via +exec autoexec.cfg
// Values copied from my own CS2 settings, so it just pins what I already play with.

// Mouse
sensitivity 1.33                 // 800 dpi, eDPI 1064
zoom_sensitivity_ratio 1
cl_sniper_auto_rezoom 0

// Crosshair: static cross, length 3, gap 1, thickness 2, no outline, 0 255 165
cl_crosshairstyle 4
cl_crosshair_length 3
cl_crosshair_gap 1
cl_crosshair_thickness 2
cl_crosshair_screen_height 1080
cl_crosshair_drawoutline 0
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 165
cl_crosshairalpha 255
cl_crosshair_friendly_warning 0

// Viewmodel
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1

// HUD and radar
hud_scaling 1.1
cl_hud_color 0
cl_radar_scale 0.35
cl_hud_radar_scale 1.2
cl_radar_rotate 1
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 1

// Audio: game at 60%, music mostly off
volume 0.6
snd_mute_losefocus 1
snd_menumusic_volume 0
snd_roundstart_volume 0
snd_roundaction_volume 0
snd_mapobjective_volume 0.04
snd_tensecondwarning_volume 0.06
snd_roundend_volume 0.16
snd_mvp_volume 0.16
snd_deathcamera_volume 0.16

// Performance
fps_max 1000

// Binds
bind MWHEELUP "+jump"
unbind MWHEELDOWN
bind SPACE "+voicerecord"
bind q "lastinv"
bind z "+lookatweapon"
bind g "slot6"                   // HE
bind f "slot7"                   // flash
bind c "slot8"                   // smoke
bind k "slot9"                   // decoy
bind v "slot10"                  // molotov
bind MOUSE5 "drop"
unbind MOUSE4
bind m "radio"
bind "=" "say GET LEETIFY"

host_writeconfig
echo "autoexec.cfg loaded"
